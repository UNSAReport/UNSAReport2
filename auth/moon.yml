language: typescript

tasks:
  dev:
    command: bash
    args:
      - -c
      - 'set -a; source ../.env.dev; source .env.dev; exec bun run --hot src/index.ts'
    deps:
      - root:infra-up
    options:
      cache: false
      persistent: true
      runInCI: false

  build:
    command: bun
    args:
      - build
      - --target=bun
      - --minify
      - --outdir=./dist
      - src/index.ts
      - src/db/migrate.ts

  # E2E/roles suites fail identically in the source repos (need live OAuth);
  # keep runnable locally via `moon run auth:test`, out of the CI gate.
  test:
    command: bun
    args:
      - test
    deps:
      - db-migrate
    options:
      cache: false
      runInCI: false

  typecheck:
    command: bun
    args:
      - run
      - check:ts

  lint:
    command: bun
    args:
      - run
      - check:biome

  db-migrate:
    command: bun
    args:
      - run
      - db:migrate
    options:
      cache: false
