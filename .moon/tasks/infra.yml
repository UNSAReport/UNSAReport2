tasks:
  decrypt:
    description: 'Materialize .env.<ENV> from examples, sops vaults (if keys present), and local overrides'
    command: bash
    args:
      - ${MOON_WORKSPACE_ROOT:-.}/scripts/materialize-env.sh
    options:
      cache: false
      runInCI: false

  infra-up:
    description: 'Create <ENV> network and start gateway, databases, and object storage'
    command: bash
    args:
      - -c
      - 'docker network create unsareport-${ENV:-dev} 2>/dev/null || true; docker compose -f ${MOON_WORKSPACE_ROOT:-.}/compose.${ENV:-dev}.yml up -d'
    deps:
      - decrypt
    options:
      cache: false
      runInCI: false

  infra-down:
    description: 'Stop gateway, databases, and object storage'
    command: bash
    args:
      - -c
      - 'docker compose -f ${MOON_WORKSPACE_ROOT:-.}/compose.${ENV:-dev}.yml down'
    options:
      cache: false
      runInCI: false
