language: go

tasks:
  dev:
    command: bash
    args:
      - -c
      - 'set -a; [ -f .env.${ENV:-dev} ] && source .env.${ENV:-dev}; exec go run ./cmd/unsarep'
    options:
      cache: false
      persistent: true
      runInCI: false

  build:
    command: bash
    args:
      - -c
      - 'go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep

  build-linux-amd64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-linux-amd64 ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-linux-amd64

  build-linux-arm64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-linux-arm64 ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-linux-arm64

  build-darwin-amd64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-darwin-amd64 ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-darwin-amd64

  build-darwin-arm64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-darwin-arm64 ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-darwin-arm64

  build-windows-amd64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-windows-amd64.exe ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-windows-amd64.exe

  build-windows-arm64:
    command: bash
    args:
      - -c
      - 'CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "-s -w ${VERSION:+-X github.com/UNSAReport/tui/internal/config.Version=$VERSION}" -o dist/unsarep-windows-arm64.exe ./cmd/unsarep'
    env:
      VERSION: '${VERSION:-dev}'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - dist/unsarep-windows-arm64.exe

  checksums:
    command: bash
    args:
      - -c
      - 'cd dist && sha256sum unsarep-linux-amd64 unsarep-linux-arm64 unsarep-darwin-amd64 unsarep-darwin-arm64 unsarep-windows-amd64.exe unsarep-windows-arm64.exe > checksums.txt'
    deps:
      - build-linux-amd64
      - build-linux-arm64
      - build-darwin-amd64
      - build-darwin-arm64
      - build-windows-amd64
      - build-windows-arm64
    inputs:
      - 'dist/unsarep-*'
    outputs:
      - dist/checksums.txt

  build-all:
    deps:
      - checksums
    outputs:
      - dist/unsarep-*
      - dist/checksums.txt

  test:
    command: go
    args:
      - test
      - ./...

  lint:
    command: golangci-lint
    args:
      - run

  vet:
    command: go
    args:
      - vet
      - ./...
