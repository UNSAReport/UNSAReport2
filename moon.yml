tasks:
  dev:
    description: 'Run all services natively (gateway must be up via infra-up)'
    deps:
      - auth:dev
      - registry:dev
      - slides:dev
      - website:dev

  lint:
    description: 'Lint everything (services via biome, tui via golangci-lint + go vet)'
    deps:
      - auth:lint
      - registry:lint
      - slides:lint
      - tui:lint
      - tui:vet
      - website:lint

  typecheck:
    description: 'Typecheck everything'
    deps:
      - auth:typecheck
      - registry:typecheck
      - slides:typecheck
      - website:typecheck
      - api:typecheck
      - schemas:typecheck

  test:
    description: 'Test everything (auth:test stays local-only: needs live OAuth, run via moon run auth:test)'
    deps:
      - registry:test
      - slides:test
      - tui:test

  check:
    description: 'Lint and typecheck everything (no tests; use :test)'
    deps:
      - auth:lint
      - registry:lint
      - slides:lint
      - tui:lint
      - tui:vet
      - website:lint
      - auth:typecheck
      - registry:typecheck
      - slides:typecheck
      - website:typecheck
      - api:typecheck
      - schemas:typecheck
