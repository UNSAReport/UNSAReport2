# Example ingress — k8s manages networking, website only needs env.
# Paths:
#   /                → website:3000
#   /registry/*      → website:3000 (same app)
#   /auth/*          → website:3000 (login/me/pat pages)
#   /api/auth/*      → auth:3000 (strip /api)
#   /api/registry/*  → registry:3001 (strip /api)
#   /.well-known/jwks.json → auth:3000
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unsa-website
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: unsareport.org
      http:
        paths:
          - path: /()(.*)
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 3000
          - path: /api/auth(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3000
          - path: /api/registry(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: registry-service
                port:
                  number: 3001
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: auth-service
                port:
                  number: 3000
