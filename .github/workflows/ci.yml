name: CI

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  moon:
    name: Moon (affected build, test, typecheck, lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idppassword
          POSTGRES_DB: idp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://idp:idppassword@localhost:5432/idp_db
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: unsareport-registry
      S3_ACCESS_KEY: seaweedadmin
      S3_SECRET_KEY: seaweedadmin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track base branch
        if: github.base_ref != ''
        run: git branch --track ${{ github.base_ref }} origin/${{ github.base_ref }} || true

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: 'moon ci :build :test :typecheck :lint'

      - uses: 'moonrepo/run-report-action@v1'
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      registry: ${{ steps.filter.outputs.registry }}
      slides: ${{ steps.filter.outputs.slides }}
      website: ${{ steps.filter.outputs.website }}
      tui: ${{ steps.filter.outputs.tui }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth/**'
              - 'packages/**'
            registry:
              - 'registry/**'
              - 'packages/**'
            slides:
              - 'slides/**'
              - 'packages/**'
            website:
              - 'web/**'
              - 'packages/**'
            tui:
              - 'tui/**'

  image-auth:
    name: Image auth
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/unsareport/unsareport2/auth
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  image-registry:
    name: Image registry
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/unsareport/unsareport2/registry
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./registry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  image-slides:
    name: Image slides
    needs: changes
    if: needs.changes.outputs.slides == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/unsareport/unsareport2/slides
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./slides/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  image-website:
    name: Image website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/unsareport/unsareport2/website
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  check-tui:
    name: Check TUI multiplatform builds
    needs: changes
    if: needs.changes.outputs.tui == 'true' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track base branch
        if: github.base_ref != ''
        run: git branch --track ${{ github.base_ref }} origin/${{ github.base_ref }} || true

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multiplatform binaries and checksums
        run: moon run tui:build-all

  release-tui:
    name: Release unsarep TUI binaries
    needs: moon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multiplatform binaries and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: moon run tui:build-all

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            tui/dist/unsarep-linux-amd64 \
            tui/dist/unsarep-linux-arm64 \
            tui/dist/unsarep-darwin-amd64 \
            tui/dist/unsarep-darwin-arm64 \
            tui/dist/unsarep-windows-amd64.exe \
            tui/dist/unsarep-windows-arm64.exe \
            tui/dist/checksums.txt \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
